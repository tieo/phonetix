[workspace]
members = ["pack", "packbuild", "wasm", "android"]

[package]
name = "lexcore"
version = "0.1.0"
edition = "2021"
description = "The reading core: what a word means, how it is said, and which of them are worth annotating."

[lib]
crate-type = ["lib"]

[dependencies]
# The pack is what the cascade reads; the core cannot reach a word any other way.
lexpack = { path = "pack" }
unicode-segmentation = "1.13"

[dev-dependencies]
# The cascade is tested against packs built the way a real one is.
lexpack = { path = "pack", features = ["write"] }
serde_json = "1.0.151"
