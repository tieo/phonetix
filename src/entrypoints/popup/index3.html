<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  :root {
  border: 2px solid green
}  
  .parent { position: relative; border: 2px solid red; padding: 8px; width: 200px; min-height: 32px;  }
  .selector-container { position: absolute; background: #f0f0f0; padding: 8px; cursor: pointer; }
  .selector-menu { display: none; background: #ddd; margin-top: 4px; border: 1px solid #aaa; }
  .selector-menu.show { display: block; }
  .menu-item { padding: 8px; }
  .menu-item:hover { background: #ccc; }
</style>
</head>
<body>
<div class="parent">
  <div class="selector-container" id="selectorContainer">
    Selected Language
    <div class="selector-menu" id="dropdownMenu">
      <div class="menu-item">Detect Language</div>
      <div class="menu-item">English</div>
      <div class="menu-item">German</div>
    </div>
  </div>
</div>

<script>
function toggleDropdown() {
  document.getElementById('dropdownMenu').classList.toggle('show');
}

document.getElementById('selectorContainer').addEventListener('click', toggleDropdown);
</script>
</body>
</html>
