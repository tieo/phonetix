name: Release

# Tag a version to build, sign and publish it:
#   pnpm version minor && git push --follow-tags
# AMO rejects a version it has already seen, so the tag must be a new version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm fetch:dict

      # The extension imports the core, so it is compiled before anything is bundled.
      - uses: ./.github/actions/core-wasm
      - name: Build
        run: pnpm build:firefox && pnpm build

      - name: Sign (AMO, unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.MOZ_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.MOZ_API_SECRET }}
        # AMO's approval queue can run long when its signing service is backed up, and
        # a timeout leaves the version submitted but unsigned — AMO then refuses to
        # re-upload the same number, so the version is wasted. Wait up to 90 minutes,
        # enough to ride out a normal backlog without holding a runner for hours.
        run: |
          pnpm dlx web-ext@latest sign \
            --channel=unlisted \
            --approval-timeout=5400000 \
            --source-dir=.output/firefox-mv2 \
            --artifacts-dir=.output/signed

      # The Chrome zip is published alongside the signed xpi, so what it ships is checked
      # in a real browser first: the core answering words, and the card drawing them.
      - uses: astral-sh/setup-uv@v5
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          # Pinned to match ci.yml.
          chrome-version: '149'
      - name: Verify the Chrome build
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:lex && pnpm test:cards

      - name: Package Chrome zip
        run: pnpm zip

      # The Android app, as the debug build: it installs on any phone with sideloading on,
      # which is how this app is used, and needs no signing key in the repository.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Build Android app
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Name the APK after the release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ".output/phonetix-${GITHUB_REF_NAME}-android-debug.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            .output/signed/*.xpi .output/*-chrome.zip .output/*-android-debug.apk
