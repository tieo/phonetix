name: Release

# Tag a version to build, sign and publish it:
#   pnpm version minor && git push --follow-tags
# AMO rejects a version it has already seen, so the tag must be a new version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm fetch:dict

      - name: Build
        run: pnpm build:firefox && pnpm build

      - name: Sign (AMO, unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.MOZ_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.MOZ_API_SECRET }}
        # AMO's approval queue can take hours when its signing service is backed up,
        # and a timeout leaves the version submitted but unsigned — AMO then refuses to
        # re-upload the same number, so the version is wasted. Wait up to 5 hours
        # (under the job's own timeout) rather than lose the release to their queue.
        run: |
          pnpm dlx web-ext@latest sign \
            --channel=unlisted \
            --approval-timeout=18000000 \
            --source-dir=.output/firefox-mv2 \
            --artifacts-dir=.output/signed

      # The signed artifact is what users install, so verify it really works in
      # Firefox (espeak runs in the background page there, not an offscreen doc)
      # before publishing it.
      - uses: astral-sh/setup-uv@v5
      - uses: browser-actions/setup-firefox@v1
        id: firefox
      - name: Verify signed xpi in Firefox
        env:
          PHONETIX_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: pnpm test:firefox

      - name: Package Chrome zip
        run: pnpm zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            .output/signed/*.xpi .output/*-chrome.zip
