name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch dictionaries
        run: pnpm fetch:dict
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build (Chrome)
        run: pnpm build
      - name: Build (Firefox)
        run: pnpm build:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: .output/chrome-mv3
          retention-days: 7

  # Behavioral suite: drives the built extension in headless Chrome. Includes the
  # subsystem health check, so an engine that silently stops working (as the
  # language detector once did) fails CI instead of degrading unnoticed.
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          # Pinned: Chrome 150 loads the extension but stops injecting its content
          # scripts in headless, which would make the suite pass against nothing.
          chrome-version: '149'
      - run: pnpm install --frozen-lockfile
      - name: Fetch dictionaries
        run: pnpm fetch:dict
      - run: pnpm build
      - name: Integration suite
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:integration
