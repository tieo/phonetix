name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The dictionaries are a ~30 MB release asset that changes only when the
      # data tag does, so they are keyed on the fetch script rather than on the
      # source tree.
      - uses: actions/cache@v4
        with:
          path: public/dictionaries
          key: dictionaries-${{ hashFiles('scripts/fetch-dictionaries.mjs') }}
      - name: Fetch dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm fetch:dict
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build (Chrome)
        run: pnpm build
      - name: Build (Firefox)
        run: pnpm build:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: .output/chrome-mv3
          retention-days: 7

  # Behavioral suite: drives the built extension in headless Chrome. Includes the
  # subsystem health check, so an engine that silently stops working (as the
  # language detector once did) fails CI instead of degrading unnoticed.
  #
  # It builds its own extension rather than waiting on the build job: the two run
  # in parallel, which is the shorter wall clock even though it costs a second
  # build. The dictionaries come from the shared cache.
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          # Pinned: Chrome 150 loads the extension but stops injecting its content
          # scripts in headless, which would make the suite pass against nothing.
          chrome-version: '149'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: public/dictionaries
          key: dictionaries-${{ hashFiles('scripts/fetch-dictionaries.mjs') }}
      - name: Fetch dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm fetch:dict
      - run: pnpm build
      - name: Integration suite
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:integration
      - name: IPA symbol names match the IPA
        run: pnpm test:names
      - name: Hover reveal lands on the word (all layouts)
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:reveal
      - name: Popup layout
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:popup
      - name: The mouth diagram is visible
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:diagram
      - name: Human recordings match the word's language
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:audio
      - name: No reveal outlives its word (single-page apps)
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:stale
      - name: Accents and espeak voices
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:voices
      - name: Dictionary pack fetching
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:packs

  # The same behaviour on the other engine. Chrome cannot stand in for it: the two
  # differ in exactly the places that break quietly — Firefox's chrome.* is
  # callback-only, and delivering settings by messaging the active tab worked in
  # Chrome while doing nothing here. This drives the real popup control in real
  # Firefox and compares the words on the page.
  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: browser-actions/setup-firefox@v1
        id: firefox
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: public/dictionaries
          key: dictionaries-${{ hashFiles('scripts/fetch-dictionaries.mjs') }}
      - name: Fetch dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm fetch:dict
      - run: pnpm zip:firefox
      - name: Firefox behaviour (health, accents)
        env:
          PHONETIX_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          XPI=$(ls -t .output/*firefox*.zip | head -1)
          PHONETIX_XPI="$XPI" pnpm test:firefox
          PHONETIX_XPI="$XPI" uv run --with marionette_driver python scripts/proofread/reveal_position.py firefox
          PHONETIX_XPI="$XPI" uv run --with marionette_driver python scripts/proofread/stale_reveal.py firefox
