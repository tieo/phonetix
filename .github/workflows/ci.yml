name: CI

# Not on every push. The same checks run locally in seconds against a toolchain that is
# already there (scripts/ci.sh, or `act` for the workflow itself), and a runner repeating them
# on every commit spends a month of minutes in a week.
on:
  pull_request:
  workflow_dispatch:

# One run per branch: a push that lands while an older run is still going makes that run
# pointless, and paying for it does not make it less so.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The dictionaries are a ~30 MB release asset that changes only when the
      # data tag does, so they are keyed on the fetch script rather than on the
      # source tree.
      - uses: actions/cache@v4
        with:
          path: assets/dictionaries
          key: dictionaries-${{ hashFiles('scripts/fetch-dictionaries.mjs') }}
      - name: Fetch dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm fetch:dict
      - name: Typecheck
        run: pnpm check
      # The extension imports the core, so it is compiled before anything is bundled.
      - uses: ./.github/actions/core-wasm
      - name: Build (Chrome)
        run: pnpm build
      - name: Build (Firefox)
        run: pnpm build:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: .output/chrome-mv3
          retention-days: 7

  # What the extension does, driven in a real headless Chrome: the core answering words
  # through the packs a host serves, and the card drawing every state it has.
  #
  # It builds its own extension rather than waiting on the build job: the two run in
  # parallel, which is the shorter wall clock even though it costs a second build.
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          # Pinned: Chrome 150 loads the extension but stops injecting its content
          # scripts in headless, which would make the suite pass against nothing.
          chrome-version: '149'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: assets/dictionaries
          key: dictionaries-${{ hashFiles('scripts/fetch-dictionaries.mjs') }}
      - name: Fetch dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm fetch:dict
      # The extension imports the core, so it is compiled before anything is bundled.
      - uses: ./.github/actions/core-wasm
      - run: pnpm build
      # The merge book draws itself out of docs/merge/surface.html, so the page and the model
      # have to name the same states: one drawn and never declared, or declared and never
      # drawn, is how six views ended up naming twelve pictures nobody produced. The renderer
      # says so and exits non-zero. Pixels are deliberately not compared, because the page
      # asks for system font stacks and a runner resolves them differently from a developer's
      # machine, so every box would come out a different size and the check would be red for
      # a reason that is nobody's fault.
      # Every colour, size and radius is declared once, on the page a person looks at when
      # deciding them. The phone cannot read a stylesheet, so the same declarations are written
      # out as data and as a Kotlin object; this fails when the page has moved on without them,
      # which is the drift that makes a card look right in a browser and wrong on a phone.
      - name: Both platforms have the same tokens and tables
        run: |
          uv run python tools/gen_types.py --check
      - name: The merge book's page and model name the same states
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: uv run --with websocket-client python tools/render-merge.py
      - name: IPA symbol names match the IPA
        run: pnpm test:names
      - name: The core answers inside the extension
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:lex
      - name: Every card state draws what that state means
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:cards
      - name: A page is annotated, opens a card, and comes back
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:page
      - name: Every setting changes what the reader sees
        env:
          PHONETIX_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm test:settings

  # The reading core, which is one crate compiled twice: to WebAssembly for the extension and
  # to a native library for the overlay. Everything about what a word means, how it is said and
  # how a pack is read lives here, so this is the job that keeps the two platforms from
  # answering differently. The two target builds are part of it because a crate that compiles
  # for the host and not for a phone is a crate that only half exists.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Tests
        working-directory: core
        run: cargo test --workspace
      - name: Formatting and lints
        working-directory: core
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      # The reader has to compile for a browser and for a phone, and the writer only ever runs
      # here, which is why compression is behind a feature the reader does not turn on.
      - name: The reader builds for the browser
        working-directory: core
        run: cargo build -p lexcore --target wasm32-unknown-unknown
      - name: The reader builds for the phone
        working-directory: core
        run: cargo build -p lexcore --target aarch64-linux-android

  # The Android app. Its unit tests are what keep the port agreeing with the extension: the
  # sprinkle rule, the display form of a transcription and the symbol table are asserted
  # against vectors the extension generates, so a rule changed on one side without the other
  # fails here rather than giving one setting two meanings on two devices.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The wrapper jar is a build artefact and is not committed, so Gradle itself is set up
      # at the version the wrapper names and run directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: assets/dictionaries
          key: dictionaries-${{ hashFiles('scripts/fetch-dictionaries.mjs') }}
      # The app bundles the extension's dictionary and word list at build time.
      - name: Fetch dictionaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm fetch:dict
      - name: Unit tests (parity with the extension)
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: phonetix-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
